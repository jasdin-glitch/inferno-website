<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chapters | IGNIX</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#070707;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    padding:18px 20px;
    background:#0b0b0b;
    border-bottom:1px solid #292929;
}

.logo{
    color:#ff3b18;
    font-size:25px;
    font-weight:bold;
    letter-spacing:4px;
    text-decoration:none;
}

.container{
    max-width:900px;
    margin:auto;
    padding:45px 20px;
}
.search-box{
    max-width:600px;
    margin:0 auto 30px;
}

.search-box input{
    width:100%;
    padding:14px 18px;
    border-radius:30px;
    border:1px solid #333;
    background:#111;
    color:white;
    font-size:16px;
    outline:none;
}

.search-box input:focus{
    border-color:#ff3b18;
}

.search-box input::placeholder{
    color:#888;
    }
h1{
    color:#ff3b18;
    text-align:center;
    margin-bottom:35px;
}

.chapter{
    background:#111;
    border:1px solid #292929;
    border-radius:15px;
    padding:22px;
    margin-bottom:18px;
}

.chapter h2{
    margin-bottom:8px;
}

.chapter p{
    color:#999;
    margin-bottom:18px;
}

.read{
    display:inline-block;
    background:#ff3b18;
    color:white;
    text-decoration:none;
    padding:11px 20px;
    border-radius:25px;
    font-weight:bold;
}

.read:hover{
    background:#ff5a3d;
}
.coming{
    display:inline-block;
    color:#888;
    border:1px solid #333;
    padding:9px 16px;
    border-radius:20px;
    font-size:14px;
}

.coming-soon{
    opacity:0.75;
    }
.back{
    display:block;
    text-align:center;
    margin-top:35px;
    color:#aaa;
    text-decoration:none;
}

footer{
    text-align:center;
    padding:30px;
    color:#777;
    border-top:1px solid #292929;
}
</style>
</head>

<body>

<header>

<a href="index.html" class="logo">IGNIX</a>

</header>

<main class="container">

<h1>📖 Chapters</h1>
<div class="search-box">
    <input
        type="text"
        id="chapterSearch"
        placeholder="🔎 Search chapters..."
        onkeyup="searchChapters()"
    >
    </div>
<div class="chapter">

<h2>Chapter 1</h2>

<p>Rise of Jasdin</p>
<div class="chapter coming-soon">

    <h2>Chapter 2</h2>

    <p>Coming Soon</p>

    <span class="coming">🔒 Coming Soon</span>

</div>
<a href="reader.html" class="read">
Read Chapter →
</a>

</div>

<a href="index.html" class="back">
← Back to Home
</a>

</main>

<footer>

© 2026 IGNIX. All rights reserved.

</footer>
<script>
function searchChapters() {
    const search = document.getElementById("chapterSearch").value.toLowerCase();
    const chapters = document.querySelectorAll(".chapter");

    chapters.forEach(function(chapter) {
        const text = chapter.innerText.toLowerCase();

        if (text.includes(search)) {
            chapter.style.display = "block";
        } else {
            chapter.style.display = "none";
        }
    });
}
</script>
</body>
</html>
