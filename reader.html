<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>IGNIX — Chapter 1</title>


<style>

/* =========================
   BASIC RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


/* =========================
   BODY
========================= */

body{

    background:#050505;

    color:white;

    font-family:Arial,sans-serif;

    overflow-x:hidden;

}


/* =========================
   HEADER
========================= */

header{

    position:sticky;

    top:0;

    z-index:10;

    background:#0b0b0b;

    border-bottom:1px solid #292929;

    padding:15px;

    display:flex;

    align-items:center;

    justify-content:space-between;

}


.logo{

    color:#ff3b18;

    font-weight:bold;

    letter-spacing:3px;

}


.back{

    color:#ddd;

    text-decoration:none;

}


.back:hover{

    color:#ff3b18;

}


/* =========================
   TITLE
========================= */

.title{

    text-align:center;

    padding:25px 15px;

}


.title h1{

    color:#ff3b18;

    margin-bottom:8px;

}


.title p{

    color:#999;

}


/* =========================
   LOADING
========================= */

#loading{

    padding:50px 20px;

    text-align:center;

    color:#aaa;

}


/* =========================
   READER
========================= */

.reader{

    width:100%;

    max-width:1000px;

    margin:auto;

    text-align:center;

    overflow-x:auto;

    overflow-y:hidden;

    padding:0 0 15px;

}


/*
   The canvas width is controlled
   by JavaScript.
*/

canvas{

    display:block;

    height:auto;

    max-width:none;

    background:white;

    margin:0 auto 10px;

}


/* =========================
   CONTROLS
========================= */

.controls{

    position:sticky;

    bottom:0;

    z-index:20;

    background:rgba(5,5,5,0.97);

    padding:10px 8px;

    text-align:center;

    border-top:1px solid #292929;

    box-shadow:
    0 -4px 15px rgba(0,0,0,0.35);

}


.controls button{

    min-width:85px;

    min-height:44px;

    padding:12px 16px;

    font-size:14px;

}


button{

    background:#ff3b18;

    color:white;

    border:0;

    padding:12px 18px;

    border-radius:25px;

    margin:4px;

    font-weight:bold;

    cursor:pointer;

    min-height:44px;

}


button:disabled{

    opacity:0.4;

    cursor:not-allowed;

}


button:active{

    transform:scale(0.97);

}


.page-number{

    display:inline-block;

    min-width:90px;

    margin:4px 5px;

    color:#aaa;

}


/* =========================
   FOOTER
========================= */

footer{

    text-align:center;

    padding:30px 10px;

    font-size:12px;

    color:#777;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    header{

        padding:14px 15px;

    }


    .title{

        padding:20px 10px;

    }


    .title h1{

        font-size:24px;

    }


    .title p{

        font-size:14px;

    }


    .reader{

        padding-left:0;

        padding-right:0;

    }


    .controls{

        padding:8px 4px;

    }


    .controls button{

        min-width:78px;

        padding:10px 11px;

        font-size:13px;

    }


    .page-number{

        min-width:75px;

        font-size:13px;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

<a
href="index.html"
class="back"
>
← Back
</a>


<div class="logo">
IGNIX
</div>

</header>


<!-- =========================
     TITLE
========================= -->

<div class="title">

<h1>
Chapter 1
</h1>


<p>
IGNIX — Rise of Jasdin
</p>

</div>


<!-- =========================
     LOADING
========================= -->

<div id="loading">

Loading Chapter 1...

</div>


<!-- =========================
     READER
========================= -->

<div
class="reader"
id="reader"
>
</div>


<!-- =========================
     CONTROLS
========================= -->

<div class="controls">


<button
id="previous"
onclick="previousPage()"
>
◀ Previous
</button>


<span
class="page-number"
id="pageNumber"
>
Page 1 / ...
</span>


<button
id="next"
onclick="nextPage()"
>
Next ▶
</button>


<br>


<button
onclick="zoomOut()"
>
🔍−
</button>


<button
onclick="resetZoom()"
>
Reset
</button>


<button
onclick="zoomIn()"
>
🔍+
</button>


</div>


<!-- =========================
     FOOTER
========================= -->

<footer>

© 2026 IGNIX. All rights reserved.

</footer>


<!-- =========================
     PDF.JS
========================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<script>

/* =========================
   PDF FILE
========================= */

const params = new URLSearchParams(window.location.search);

const chapterNumber =
    Number(params.get("chapter")) || 1;


const chapterFiles = {

    1:
    "IGNIX_chap1_high_quality_23-25MB_FINAL (1).pdf",

    2:
    "IGNIX_Chapter_2_24-25MB.pdf"
};
    


const pdfFile =
chapterFiles[chapterNumber] ||
chapterFiles[1];


/* =========================
   VARIABLES
========================= */

let pdf = null;

let currentPage = 1;


/*
   1 = phone-friendly reading size

   >1 = zoom in

   <1 = zoom out
*/

let zoomLevel = 1;


/*
   Automatically calculated
   page-width scale.
*/

let fitScale = 1;


/*
   Prevents overlapping renders.
*/

let renderTask = null;


/* =========================
   PDF.JS WORKER
========================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================
   LOAD PDF
========================= */

async function loadPDF(){

    try{

        pdf =
        await pdfjsLib
        .getDocument(pdfFile)
        .promise;


        document
        .getElementById("loading")
        .style.display = "none";


        document
        .getElementById("pageNumber")
        .textContent =
        "Page " +
        currentPage +
        " / " +
        pdf.numPages;


        updateButtons();


        await showPage();

    }

    catch(error){

        document
        .getElementById("loading")
        .textContent =
        "Unable to load Chapter 1.";

        console.error(
            "PDF loading error:",
            error
        );

    }

}


/* =========================
   SHOW PAGE
========================= */

async function showPage(){

    if(!pdf){

        return;

    }


    const page =
    await pdf.getPage(currentPage);


    const container =
    document.getElementById("reader");


    /*
       Cancel an old render
       if necessary.
    */

    if(renderTask){

        try{

            renderTask.cancel();

        }

        catch(error){

            console.log(error);

        }

    }


    container.innerHTML = "";


    /*
       Get the original page
       dimensions.
    */

    const baseViewport =
    page.getViewport({
        scale:1
    });


    /*
       Available phone width.

       window.innerWidth is used
       so the comic can use almost
       the complete phone screen.
    */

    const availableWidth =
    Math.max(
        window.innerWidth - 4,
        280
    );


    /*
       Calculate width needed to
       make the comic page fill the
       available phone width.
    */

    fitScale =
    availableWidth /
    baseViewport.width;


    /*
       Prevent extreme values.
    */

    fitScale =
    Math.max(
        Math.min(
            fitScale,
            2
        ),
        0.5
    );


    /*
       Apply zoom.

       Default:
       fit page width.

       Zoom +:
       larger than screen.
    */

    const finalScale =
    fitScale * zoomLevel;


    const viewport =
    page.getViewport({
        scale:finalScale
    });


    /*
       Create canvas.
    */

    const canvas =
    document.createElement("canvas");


    const context =
    canvas.getContext("2d");


    canvas.width =
    Math.floor(viewport.width);


    canvas.height =
    Math.floor(viewport.height);


    /*
       Display at the rendered
       size.

       This keeps the zoom sharp.
    */

    canvas.style.width =
    viewport.width + "px";


    canvas.style.height =
    viewport.height + "px";


    /*
       Center when the page fits.

       When zoomed in, allow
       horizontal scrolling.
    */

    if(viewport.width <= availableWidth){

        canvas.style.marginLeft =
        "auto";

        canvas.style.marginRight =
        "auto";

    }

    else{

        canvas.style.marginLeft =
        "0";

        canvas.style.marginRight =
        "0";

    }


    container.appendChild(canvas);


    /*
       Render the PDF.
    */

    renderTask =
    page.render({

        canvasContext:context,

        viewport:viewport

    });


    try{

        await renderTask.promise;

    }

    catch(error){

        if(
            error.name !==
            "RenderingCancelledException"
        ){

            console.error(
                "Rendering error:",
                error
            );

        }

    }


    /*
       Update page number.
    */

    document
    .getElementById("pageNumber")
    .textContent =
    "Page " +
    currentPage +
    " / " +
    pdf.numPages;


    updateButtons();


    /*
       New page starts at the top.
    */

    window.scrollTo({

        top:0,

        behavior:"auto"

    });

}


/* =========================
   NEXT PAGE
========================= */

function nextPage(){

    if(
        pdf &&
        currentPage <
        pdf.numPages
    ){

        currentPage++;

        showPage();

    }

}


/* =========================
   PREVIOUS PAGE
========================= */

function previousPage(){

    if(
        pdf &&
        currentPage > 1
    ){

        currentPage--;

        showPage();

    }

}


/* =========================
   ZOOM IN
========================= */

function zoomIn(){

    zoomLevel =
    Math.min(
        zoomLevel + 0.25,
        3
    );

    showPage();

}


/* =========================
   ZOOM OUT
========================= */

function zoomOut(){

    zoomLevel =
    Math.max(
        zoomLevel - 0.25,
        0.5
    );

    showPage();

}


/* =========================
   RESET
========================= */

function resetZoom(){

    zoomLevel = 1;

    showPage();

}


/* =========================
   BUTTON STATE
========================= */

function updateButtons(){

    if(!pdf){

        return;

    }


    document
    .getElementById("previous")
    .disabled =
    currentPage === 1;


    document
    .getElementById("next")
    .disabled =
    currentPage === pdf.numPages;

}


/* =========================
   PHONE ROTATION / RESIZE
========================= */

let resizeTimer;


window.addEventListener(
    "resize",
    function(){

        clearTimeout(resizeTimer);


        resizeTimer =
        setTimeout(
            function(){

                if(pdf){

                    showPage();

                }

            },
            250
        );

    }
);


/* =========================
   START
========================= */

loadPDF();

</script>

</body>

    </html>
